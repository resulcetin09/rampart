<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rampart">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="560" height="160" rx="24" fill="#0b1120"/>

  <!-- a shield formed from a crenellated rampart wall -->
  <g transform="translate(30 26)">
    <path d="M6 2 h14 v10 h12 V2 h14 v10 h12 V2 h14 v10 h12 V2 h8
             V58 C100 82 78 100 53 108 C28 100 6 82 6 58 Z"
          fill="url(#r)"/>
    <path d="M6 2 h14 v10 h12 V2 h14 v10 h12 V2 h14 v10 h12 V2 h8
             V58 C100 82 78 100 53 108 C28 100 6 82 6 58 Z"
          fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
    <!-- brick courses -->
    <g stroke="#0b1120" stroke-width="2.4" opacity="0.5">
      <line x1="6" y1="30" x2="100" y2="30"/>
      <line x1="30" y1="22" x2="30" y2="30"/>
      <line x1="53" y1="22" x2="53" y2="30"/>
      <line x1="76" y1="22" x2="76" y2="30"/>
      <line x1="18" y1="30" x2="18" y2="46"/>
      <line x1="41" y1="30" x2="41" y2="46"/>
      <line x1="64" y1="30" x2="64" y2="46"/>
      <line x1="88" y1="30" x2="88" y2="46"/>
    </g>
    <!-- check mark: the wall holds -->
    <path d="M36 62 l12 13 l22 -26" fill="none" stroke="#0b1120" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="158" y="88" font-family="'JetBrains Mono','SF Mono',monospace" font-size="52" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">rampart</text>
  <text x="160" y="120" font-family="'JetBrains Mono','SF Mono',monospace" font-size="15.5" font-weight="400" fill="#64748b" letter-spacing="0.3">grade your web security headers &amp; TLS</text>
</svg>
